[project]
name = "nonebot-plugin-qq-group-daily-analysis"
version = "1.0.0"
description = "群聊日报：统计分析 + 话题总结 + 海报图片，可顺带生成漫画并定时推送"
readme = "nonebot_plugin_qq_group_daily_analysis/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["nonebot", "nonebot2", "daily-report", "onebot11", "qq"]

# 文字总结与生图走 HTTP 接口，需要 httpx；渲染海报走 nonebot-plugin-htmlrender
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-adapter-onebot11>=2.3.0",
    "nonebot-plugin-htmlrender>=0.6.0",
    "nonebot-plugin-apscheduler>=0.4.0",
    "nonebot-plugin-chatrecorder>=0.3.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/zlqd123/nonebot_plugin_qq_group_daily_analysis"
Repository = "https://github.com/zlqd123/nonebot_plugin_qq_group_daily_analysis"

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module = "nonebot.adapters.onebot.v11" },
]
plugin_dirs = ["nonebot_plugin_qq_group_daily_analysis"]
builtin_plugins = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 标准布局：包就是一个与仓库同名的子目录，直接指向它。
# 主题模板和素材有 40MB，会随包一起打进去——少了它们装完渲染不出图。
packages = ["nonebot_plugin_qq_group_daily_analysis"]
